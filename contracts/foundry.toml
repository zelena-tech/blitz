[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Requiere Foundry >= 1.8: ejecuta compilación, pruebas y scripts con las reglas de Monad
network = "monad"
# Necesario para verificar en MonadVision (Sourcify). La guía de Monad escribe metadata/metadata_hash;
# en Foundry 1.8 las claves reales son cbor_metadata y bytecode_hash.
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
